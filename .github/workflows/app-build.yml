name: App Build

on:
  push:
    branches: [ branch1 ]
  pull_request:
    branches: [ branch1 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build      # dopasuj do swojego projektu
